---

# Install and setup Niri and Dank Material Shell

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - yalter/niri-git
        - avengemedia/dms-git
        - avengemedia/danklinux
    install:
      install-weak-deps: false
      packages:
        - niri
        - dms
        - greetd
        - tuigreet
        #- dms-greeter
        - greetd-selinux
        - quickshell-git
        - matugen
        - material-symbols-fonts
        - cliphist
        - xwayland-satellite
        - xdg-desktop-portal-gtk
#  - type: script
#    scripts:
#      - setup-greetd.sh
  - type: systemd
    system:
      enabled:
        - greetd.service
      disabled:
        - sddm.service
