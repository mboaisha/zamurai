---

# Install and setup Niri and Dank Material Shell

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - yalter/niri-git
        - avengemedia/dms
    install:
      install-weak-deps: false
      packages:
        - niri
        - dms
        - greetd
        - greetd-selinux
  - type: systemd
    system:
      enabled:
        - greetd.service # Use greetd
      disable:
        - sddm.service # Disable sddm since it comes with the bazzite (kde) image
  - type: files
    files:
      - usr: /usr
