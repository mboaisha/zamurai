---

# Install and setup Niri and Dank Material Shell

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - yalter/niri-git
        - avengemedia/dms
        - avengemedia/danklinux
    install:
      install-weak-deps: false
      packages:
        - niri
        - dms
        - greetd
        - dms-greeter
        - greetd-selinux
  - type: script
    scripts:
      - setup-greetd.sh
  - type: systemd
    system:
      enabled:
        - greetd.service # Use greetd
      disabled:
        - sddm.service # Disable sddm since it comes with the bazzite (kde) image
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: system/etc
        destination: /etc
